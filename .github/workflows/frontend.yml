name: frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

# Least-privilege token for all jobs; actions are pinned to commit SHAs
# so a compromised tag cannot move the pin. Renovate/Dependabot manages bumps.
permissions:
  contents: read

jobs:
  analyze-and-test:
    name: flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
