name: security

on:
  pull_request:
  push:

# Least-privilege token for all jobs; actions are pinned to commit SHAs
# so a compromised tag cannot move the pin. Renovate/Dependabot manages bumps.
permissions:
  contents: read

# gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for
# organization-owned repos, which conflicts with the project's $0/month
# budget directive. The gitleaks binary itself is MIT-licensed OSS, so we
# run it directly — pinned and checksum-verified.
jobs:
  gitleaks:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          cd /tmp
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt" -o checksums.txt
          grep "linux_x64.tar.gz" checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          chmod +x gitleaks
      - name: Scan for secrets (full history)
        run: /tmp/gitleaks detect --source . --verbose --redact --exit-code 1
