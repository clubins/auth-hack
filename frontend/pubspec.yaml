name: clubins_frontend
description: Clubins customer-auth Flutter reference client.
publish_to: "none"
version: 0.2.0

environment:
  # oidc 5.x requires Dart ^3.11 (Flutter >= 3.41).
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  # Used by lib/auth to accept an injectable HTTP client for the OIDC
  # manager (tests swap in a MockClient).
  http: ^1.6.0
  oidc: ^5.0.2

dev_dependencies:
  # Clock control for token-expiry tests; matches the oidc package's own
  # test setup (the manager reads time through package:clock zones).
  clock: ^1.1.1
  flutter_lints: ^5.0.0
  flutter_secure_storage_platform_interface: ^2.1.1
  flutter_test:
    sdk: flutter
  jose_plus: ^1.0.1
  mocktail: ^1.0.4
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
